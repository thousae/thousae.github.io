---
layout: default
---
<article class="home-page">
  <header class="profile" id="profile">
    <h1>{{ site.author.name }}</h1>
    <p class="affiliation">Integrated M.S./Ph.D. Student · Sungkyunkwan University</p>
    {{ content }}
    <ul class="profile-links" id="links" aria-label="Contact and profiles">
      <li><a href="mailto:{{ site.author.email }}">Email</a></li>
      <li><a href="{{ site.links.github }}" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="{{ site.links.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ site.links.lab }}" target="_blank" rel="noopener">Lab</a></li>
    </ul>
  </header>
  <section class="publications" aria-labelledby="publications-title">
    <div class="section-heading">
      <h2 id="publications-title">Publications</h2>
      <a href="{{ '/research/' | relative_url }}">Research details →</a>
    </div>
    {% include publications.html %}
  </section>
</article>
